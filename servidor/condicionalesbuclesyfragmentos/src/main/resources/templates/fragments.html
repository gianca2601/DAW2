<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragmentos de Pedidos</title>
</head>
<body>

    <!-- Fragmento para Pedido Pendiente (Fondo Amarillo) -->
    <div th:fragment="pedidoPendiente" style="background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
        <h3 th:text="${pedido.nombre}">Nombre del Pedido</h3>
        <p><strong>Estado:</strong> ⏳ Pendiente</p>
    </div>

    <!-- Fragmento para Pedido Enviado (Fondo Azul) -->
    <div th:fragment="pedidoEnviado" style="background-color: #cce5ff; border: 1px solid #b8daff; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
        <h3 th:text="${pedido.nombre}">Nombre del Pedido</h3>
        <p><strong>Estado:</strong> 🚚 Enviado</p>
    </div>

    <!-- Fragmento para Pedido Entregado (Fondo Verde) -->
    <div th:fragment="pedidoEntregado" style="background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; margin-bottom: 10px; border-radius: 5px;">
        <h3 th:text="${pedido.nombre}">Nombre del Pedido</h3>
        <p><strong>Estado:</strong> ✅ Entregado</p>
    </div>

</body>
</html>

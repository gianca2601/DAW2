<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .producto { border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .no-productos { color: #856404; background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 6px; }
    </style>
</head>
<!-- Requisito 1: Definición de la variable local en el body -->
<body th:with="mostrar = ${filtro}">

    <h1>Catálogo de Productos</h1>
    <p>Filtro activo: <strong th:text="${mostrar}">todos</strong></p>

    <!-- Requisito 2: Recorrer lista filtrando por la variable 'mostrar' y el precio -->
    <div th:each="p : ${productos}">
        <div class="producto" 
             th:if="${mostrar == 'todos'} or 
                    (${mostrar == 'oferta'} and ${p.precio < 10}) or 
                    (${mostrar == 'caro'} and ${p.precio > 1000})">
            <h3 th:text="${p.nombre}">Nombre del Producto</h3>
            <p>Precio: <span th:text="${p.precio}">0</span> €</p>
        </div>
    </div>

    <!-- Requisito 3: Mensaje si no se muestra ningún producto -->
    <div class="no-productos" 
         th:if="${#lists.isEmpty(productos)} or 
                (${mostrar == 'oferta'} and ${#lists.isEmpty(productos.?[precio < 10])}) or 
                (${mostrar == 'caro'} and ${#lists.isEmpty(productos.?[precio > 1000])})">
        <p>⚠️ No hay ningún producto para mostrar con el filtro seleccionado.</p>
    </div>

</body>
</html>

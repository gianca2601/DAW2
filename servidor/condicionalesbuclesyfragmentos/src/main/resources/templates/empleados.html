<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Empleados</title>
    <style>
        table { width: 80%; border-collapse: collapse; margin: 20px auto; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #333; color: white; }
        .par { background-color: #f2f2f2; }
        .impar { background-color: #ffffff; }
        .direccion { font-weight: bold; color: #1a5276; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Lista de Empleados</h2>

    <table>
        <thead>
            <tr>
                <th>Nº</th>
                <th>Nombre</th>
                <th>Departamento</th>
                <th>Salario</th>
            </tr>
        </thead>
        <tbody>
            <!-- Requisito 1 y 2: Bucle con estado y clase alternada en filas pares/impares -->
            <tr th:each="e, estado : ${empleados}" 
                th:classappend="${estado.even} ? 'par' : 'impar'">
                
                <td th:text="${estado.count}">1</td>
                
                <td>
                    <!-- Requisito 3: Icono estrella solo para el primer elemento -->
                    <span th:if="${estado.first}">⭐ </span>
                    <span th:text="${e.nombre}">Nombre</span>
                </td>
                
                <!-- Requisito 4: Aplica estilo negrita si el departamento es Dirección -->
                <td th:text="${e.departamento}" 
                    th:classappend="${e.departamento == 'Dirección'} ? 'direccion'">Departamento</td>
                
                <td th:text="${e.salario} + ' €'">0 €</td>
            </tr>
        </tbody>
    </table>

</body>
</html>

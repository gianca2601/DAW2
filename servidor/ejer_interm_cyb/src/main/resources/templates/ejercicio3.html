<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>
<body>

    <h2>Resumen de Notas de Alumnos</h2>

    <table border="1">
        <head>
            <tr>
                <th>Nº</th>
                <th>Nombre</th>
                <th>Nota</th>
                <th>Resultado</th>
            </tr>
        </head>
        <body>
            <tr th:each="a, estado : ${alumnos}">
                <td th:text="${estado.count}"></td>
                <td th:text="${a.nombre}"></td>
                <td th:text="${a.nota}"></td>
                <td>
                    <span th:if="${a.nota < 5}" style="color: red;">Suspenso</span>
                    <span th:unless="${a.nota < 5}" style="color: green;">Aprobado</span>
                </td>
            </tr>
        </body>
    </table>

</body>
</html>
